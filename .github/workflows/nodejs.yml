name: Node.js CI
on:
  push:
    branches:
      - main
      - dev
      - legacy
  pull_request:
    branches:
      - main
      - dev
      - legacy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3.0.0
        with:
          version: 8
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build CI
        run: pnpm run build:ci
